<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8" />
  <title>Misty Voice Assistant</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="style.css" />
</head>
<body>

<div class="stars"></div>
<div class="container">
  <!-- HEADER -->
  <div class="header">
    <div class="logo-container">
      <div class="logo">
        <img src="asset/misty.png" alt="Misty Logo" class="misty-avatar">
      </div>
    </div>
    <h1><span class="gradient-text">Misty</span> Voice Assistant</h1>
    <p class="subtitle">Talk or type • Get instant responses</p>
    <div class="status-indicator">
      <span class="status-dot"></span>
      <p class="status" id="status">Ready to listen...</p>
    </div>
  </div>

  <!-- MAIN CONTROLS -->
  <div class="controls">
    <div class="button-group-wrapper">
      <button id="pushToTalkBtn" class="ptt-btn" title="Hold to speak">
        <span class="btn-icon">🎤</span>
      </button>
      <button id="toggleRecordBtn" class="toggle-btn" title="Click to toggle recording">⏹️ START RECORDING</button>
    </div>
    <p class="hint">Hold the microphone to speak • Click the button to toggle recording</p>

    <!-- TEXT INPUT SECTION -->
    <div class="text-input-section">
      <div class="input-wrapper">
        <input type="text" id="textInput" placeholder="Type your message here..." maxlength="200">
        <span class="char-count"><span id="charCount">0</span>/200</span>
      </div>
      <button id="sendTextBtn" class="send-btn">Send</button>
    </div>
  </div>

  <!-- RESULTS SECTION -->
  <div class="results">
    <div class="result-box transcription-box">
      <div class="result-header">
        <span class="result-icon">📝</span>
        <h3>Your Message</h3>
      </div>
      <textarea id="transcription" readonly placeholder="Your transcription will appear here..."></textarea>
    </div>

    <div class="result-box response-box">
      <div class="result-header">
        <span class="result-icon">🤖</span>
        <h3>Misty's Response</h3>
      </div>
      <textarea id="response" readonly placeholder="Misty's response will appear here..."></textarea>
    </div>
  </div>

  <!-- FOOTER -->
  <div class="footer">
    <p>Backend: <span id="backendUrl" class="backend-url">-</span></p>
    <p class="footer-text">Powered by advanced AI technology</p>
  </div>
</div>

<script src="config.js"></script>
<script src="script.js"></script>
</body>
</html>
